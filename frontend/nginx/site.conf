root /usr/share/nginx/html;
# Docker's embedded DNS: container addresses change when containers are recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 100m;
server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/x-protobuf;
gzip_min_length 1024;

# Backend API; login attempts are rate-limited per client address.
location = /api/v1/auth/login {
    limit_req zone=login burst=10 nodelay;
    include /etc/nginx/dtat/proxy.conf;
    include /etc/nginx/dtat/headers.conf;
}

location /api/ {
    include /etc/nginx/dtat/proxy.conf;
    include /etc/nginx/dtat/headers.conf;
}

# Offline basemaps (PMTiles): MapLibre reads them with HTTP range requests.
location /tiles/ {
    alias /srv/tiles/;
    include /etc/nginx/dtat/headers.conf;
    add_header Cache-Control "public, max-age=3600";
}

# Hashed build output: cache forever.
location /assets/ {
    include /etc/nginx/dtat/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /map-assets/ {
    include /etc/nginx/dtat/headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
}

# Single-page application.
location / {
    include /etc/nginx/dtat/headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
