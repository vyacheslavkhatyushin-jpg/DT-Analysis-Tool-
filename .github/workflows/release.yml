name: Release

# Pushing a tag like v0.1.0 builds the offline installation bundle
# (deploy/scripts/make-release.sh) and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build offline bundle
        run: deploy/scripts/make-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Архив для установки на ВМ без доступа в интернет: образы приложения и базы данных, docker-compose.yml, скрипты установки, бэкапа и восстановления.

          \`\`\`bash
          sha256sum -c dtat-$version.tar.gz.sha256
          sudo mkdir -p /opt/dtat
          sudo tar -xzf dtat-$version.tar.gz --strip-components=1 -C /opt/dtat
          cd /opt/dtat && sudo ./install.sh
          \`\`\`

          Подробности: [docs/DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/docs/DEPLOYMENT.md).
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "release/dtat-$version.tar.gz" "release/dtat-$version.tar.gz.sha256" \
            --title "DT Analysis Tool $version" --notes-file notes.md
